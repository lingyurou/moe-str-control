# A3-top1: hard top-1 routing (genuinely sparse).
# Each token is evaluated by exactly one expert, so expert forward passes drop to 1/4 of the
# dense mixture while the parameter count is unchanged. Identical to A1 apart from `routing`,
# which makes it a single-variable contrast. Used for the latency side of the dispatch curve.

train:
  seed: 42
  epochs: 30
  batch_size: 192
  lr: 5.0e-4
  weight_decay: 1.0e-4
  alpha: 0.01          # the auxiliary loss only matters under sparse routing; it is constant for dense
  amp: true
  workers: 8
  val_every: 2
  deterministic: true
  out_dir: checkpoints/a3_top1

model:
  backbone: svtr
  routing: top1
  num_experts: 4
  d_ff: 1024
  d_model: 256
  nhead: 8
  num_layers: 2
  dropout: 0.1

data:
  train_root: data/data_lmdb_release/training
  val_root: data/data_lmdb_release/evaluation/IIIT5k_3000
  img_h: 32
  img_w: 100
  aug: strong
  lowercase: true
