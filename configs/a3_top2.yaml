# A3-top2: hard top-2 routing, the second point on the dispatch curve.
# Each token is evaluated by two of the four experts, so expert forward passes are half of the
# dense mixture at the same parameter count. Identical to a3_top1 apart from `routing`.

train:
  seed: 42
  epochs: 30
  batch_size: 192
  lr: 5.0e-4
  weight_decay: 1.0e-4
  alpha: 0.01
  amp: true
  workers: 4
  val_every: 2
  deterministic: true
  out_dir: checkpoints/a3_top2

model:
  backbone: svtr
  routing: top2
  num_experts: 4
  d_ff: 1024
  d_model: 256
  nhead: 8
  num_layers: 2
  dropout: 0.1

data:
  train_root: data/data_lmdb_release/training
  val_root: data/data_lmdb_release/evaluation/IIIT5k_3000
  img_h: 32
  img_w: 100
  aug: strong
  lowercase: true
