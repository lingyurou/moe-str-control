project_name: "moe-str-control"
num_classes: 98          # 95 printable ASCII + BOS/EOS/PAD
max_text_length: 25      # maximum decoding length
image_size: [32, 128]    # [H, W], standard STR input

model:
  d_model: 256
  num_experts: 4
  top_k: 1
  alpha_balance: 0.01   # MoE load-balancing loss coefficient

train:
  epochs: 50
  batch_size: 64
  lr: 0.0005
  weight_decay: 0.0001
  num_workers: 4
